<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#171b4b"/>
      <stop offset="55%" stop-color="#0b1035"/>
      <stop offset="100%" stop-color="#05071d"/>
    </radialGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d5dfc" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#00c6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d946ef" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Ambient animated glows -->
  <circle cx="120" cy="80" r="210" fill="url(#glow1)" filter="url(#blur)">
    <animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;180;80" dur="11s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1490" cy="120" r="230" fill="url(#glow2)" filter="url(#blur)">
    <animate attributeName="cx" values="1490;1360;1490" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;250;120" dur="13s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1450" cy="820" r="250" fill="url(#glow1)" filter="url(#blur)">
    <animate attributeName="cx" values="1450;1320;1450" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle flowing lines -->
  <g fill="none" stroke="#7c6cff" stroke-width="2" opacity=".28">
    <path d="M-80 690 C280 540 430 840 790 650 S1250 430 1680 610">
      <animate attributeName="d"
        values="M-80 690 C280 540 430 840 790 650 S1250 430 1680 610;
                M-80 650 C300 760 470 470 820 650 S1260 780 1680 520;
                M-80 690 C280 540 430 840 790 650 S1250 430 1680 610"
        dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M-100 730 C260 580 450 880 810 690 S1260 470 1700 650" opacity=".55">
      <animate attributeName="opacity" values=".15;.5;.15" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating particles -->
  <g fill="#9ca8ff">
    <circle cx="250" cy="260" r="4"><animate attributeName="cy" values="260;220;260" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="300" r="3"><animate attributeName="cy" values="300;350;300" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="720" r="4"><animate attributeName="cy" values="720;680;720" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="760" r="3"><animate attributeName="cy" values="760;715;760" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Very subtle center glow -->
  <ellipse cx="800" cy="450" rx="430" ry="230" fill="#5865f2" opacity=".07" filter="url(#soft)">
    <animate attributeName="rx" values="430;500;430" dur="10s" repeatCount="indefinite"/>
  </ellipse>
</svg>